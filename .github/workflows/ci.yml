name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun run typecheck
      - run: bun run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
      # The pages are generated from the backend at build time; CI has no
      # backend, so it builds against the stub.
      - run: |
          bun run stub:start &
          timeout 30 sh -c 'until curl -sf http://localhost:3101/cases > /dev/null; do sleep 1; done'
        env:
          API_URL: http://localhost:3101
      - run: bun run build
        env:
          API_URL: http://localhost:3101
          # Required by getSiteUrl() in production builds. CI output is not deployed.
          NEXT_PUBLIC_SITE_URL: https://example.com
      - run: bun run fsd:check
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
        env:
          NEXT_PUBLIC_SITE_URL: https://example.com
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
