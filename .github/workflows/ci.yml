name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
      # The pages are generated from the backend at build time; CI has no
      # backend, so it builds against the stub.
      - run: |
          pnpm stub:start &
          timeout 30 sh -c 'until curl -sf http://localhost:3101/cases > /dev/null; do sleep 1; done'
        env:
          API_URL: http://localhost:3101
      - run: pnpm build
        env:
          API_URL: http://localhost:3101
          # Required by getSiteUrl() in production builds. CI output is not deployed.
          NEXT_PUBLIC_SITE_URL: https://example.com
      - run: pnpm fsd:check
      - name: Cache Playwright browser (~/.cache/ms-playwright)
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # The apt mirrors of the runner are occasionally unreachable, so the
      # system packages and the browser download are retried separately.
      - name: Install Playwright system dependencies
        run: sh scripts/retry.sh 3 15 pnpm exec playwright install-deps chromium
        timeout-minutes: 8
      - name: Install Playwright browser
        run: sh scripts/retry.sh 3 15 pnpm exec playwright install chromium
        timeout-minutes: 5
      - run: pnpm test:e2e
        timeout-minutes: 8
        env:
          NEXT_PUBLIC_SITE_URL: https://example.com
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
