schema: spec-driven

context: |
  Write all OpenSpec artifacts in English, even if the user's request is in Russian.
  Development is test-first (TDD): see "Testing" in CLAUDE.md and the writing-tests skill.
  Both locales (ru, en) must be covered when text, paths or metadata change.

rules:
  proposal:
    - Always state what is out of scope
  tasks:
    - For every behavior change add the failing-test task (red) before its implementation task (green)
    - Final tasks: bun run check; bun run fsd:check for architectural changes; bun run test:e2e for routing, proxy.ts, navigation or UI changes
    - UI tasks must include a Playwright MCP check on desktop and mobile viewports
